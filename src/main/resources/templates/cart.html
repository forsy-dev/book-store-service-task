<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{cart.title}">Your Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900" th:replace="~{fragments/layout :: layout (~{::main})}">

<main class="container mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-8" th:text="#{cart.title}">Your Shopping Cart</h1>

    <div class="flex flex-col lg:flex-row gap-8">

        <div class="lg:w-2/3">

            <div class="md:hidden space-y-4 mb-6">
                <div th:each="item : ${cartItems}" class="bg-white shadow rounded-lg p-4 border border-gray-200">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900" th:text="${item.book.name}">Book Name</h3>
                            <p class="text-sm text-gray-500" th:text="${item.book.author}">Author</p>
                        </div>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="bookName" th:value="${item.book.name}"/>
                            <button type="submit" class="text-red-600 hover:text-red-900 text-sm font-medium" th:text="#{btn.remove}">Remove</button>
                        </form>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-sm text-gray-600 mt-4 border-t pt-3">
                        <div>
                            <span class="block text-xs uppercase text-gray-400" th:text="#{book.price}">Price</span>
                            <span class="font-medium" th:text="'$' + ${#numbers.formatDecimal(item.book.price, 1, 2)}">$19.99</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-xs uppercase text-gray-400" th:text="#{book.quantity}">Qty</span>
                            <span class="font-medium" th:text="${item.quantity}">1</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-3 pt-3 border-t bg-gray-50 -mx-4 -mb-4 px-4 py-3 rounded-b-lg">
                        <span class="font-semibold text-gray-700" th:text="#{cart.subtotal}">Subtotal</span>
                        <span class="font-medium" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$19.99</span>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(cartItems)}" class="bg-white p-6 rounded-lg shadow text-center text-gray-500">
                    <span class="block mb-2" th:text="#{cart.empty}">Your cart is empty.</span>
                    <a th:href="@{/books}" class="text-blue-600 hover:text-blue-800 font-medium" th:text="#{cart.startShopping}">Start shopping!</a>
                </div>
            </div>

            <div class="hidden md:block bg-white shadow-xl rounded-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                                th:text="#{cart.product}">Product</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                                th:text="#{book.quantity}">Quantity</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                                th:text="#{book.price}">Price</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                                th:text="#{cart.subtotal}">Subtotal</th>
                            <th scope="col" class="relative px-6 py-3"><span class="sr-only" th:text="#{btn.remove}">Remove</span></th>
                        </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">

                        <tr th:each="item : ${cartItems}">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex flex-col">
                                    <span class="text-sm font-medium text-gray-900" th:text="${item.book.name}">Book Name</span>
                                    <span class="text-xs text-gray-500" th:text="${item.book.author}">Author</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-900" th:text="${item.quantity}">1</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-900" th:text="'$' + ${#numbers.formatDecimal(item.book.price, 1, 2)}">$19.99</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-semibold text-blue-600" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$19.99</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="bookName" th:value="${item.book.name}"/>
                                    <button type="submit" class="text-red-600 hover:text-red-900 cursor-pointer font-semibold transition-colors" th:text="#{btn.remove}">Remove</button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(cartItems)}">
                            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                <span class="block mb-2" th:text="#{cart.empty}">Your cart is empty.</span>
                                <a th:href="@{/books}" class="text-blue-600 hover:text-blue-800 font-medium underline" th:text="#{cart.startShopping}">Start shopping!</a>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="lg:w-1/3">
            <div class="bg-white shadow-xl rounded-lg p-6 sticky top-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4" th:text="#{cart.orderSummary}">Order Summary</h2>

                <div class="flex justify-between items-center border-t border-gray-100 pt-4 mt-4">
                    <span class="text-lg font-semibold text-gray-900" th:text="#{cart.totalCost}">Total Cost</span>

                    <div class="text-right">
                <span class="block text-2xl font-bold text-blue-700"
                      th:text="'$' + ${#numbers.formatDecimal(totalPriceUsd, 1, 2)}">
                    $0.00
                </span>

                        <span class="block text-sm font-medium text-gray-500 mt-1"
                              th:if="${totalPriceUah != null}"
                              th:text="'~ ' + ${#numbers.formatDecimal(totalPriceUah, 1, 2)} + ' ₴'">
                    ~ 0.00 ₴
                </span>

                        <span class="block text-xs text-red-400 mt-1"
                              th:if="${totalPriceUah == null}">
                    UAH conversion unavailable
                </span>
                    </div>
                </div>

                <div class="mt-6" th:if="${!#lists.isEmpty(cartItems)}">
                    <form th:action="@{/orders/submit}" method="post">
                        <button type="submit" class="w-full px-6 py-3 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all"
                                th:text="#{cart.submitOrder}">
                            Submit Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
