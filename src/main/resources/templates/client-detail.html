<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{client.title}">Client Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900" th:replace="fragments/layout :: layout (~{::main})">

<main class="container mx-auto px-6 py-12">
    <div th:object="${client}" class="bg-white p-8 rounded-lg shadow-xl max-w-2xl mx-auto">

        <a th:href="@{/clients}" class="inline-block text-blue-600 hover:text-blue-800 mb-6" th:text="#{client.back}">
            &larr; Back to Client List
        </a>

        <h1 class="text-3xl md:text-4xl font-bold mb-2" th:text="*{name}">Client Name</h1>
        <p class="text-xl text-gray-600 mb-6 break-all" th:text="*{email}">client@example.com</p>

        <div class="mb-8">
            <h2 class="text-sm font-medium text-gray-500 uppercase tracking-wider" th:text="#{client.balance}">Balance</h2>
            <p class="text-3xl font-light text-blue-700">
                $<span th:text="${#numbers.formatDecimal(client.balance, 1, 2)}">100.00</span>
            </p>
        </div>

        <div class="mb-8 p-4 rounded-md" th:classappend="*{isBlocked} ? 'bg-red-100' : 'bg-green-100'">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

                <div>
                    <h2 class="text-sm font-medium uppercase tracking-wider" th:classappend="*{isBlocked} ? 'text-red-800' : 'text-green-800'"
                        th:text="#{client.status}">
                        Account Status
                    </h2>
                    <p class="text-2xl font-semibold" th:classappend="*{isBlocked} ? 'text-red-700' : 'text-green-700'">
                        <span th:if="*{isBlocked}" th:text="#{client.blocked}">Blocked</span>
                        <span th:unless="*{isBlocked}" th:text="#{client.active}">Active</span>
                    </p>
                </div>

                <div class="w-full md:w-auto">
                    <form th:if="*{isBlocked}" th:method="put" th:action="@{/clients/{email}/unblock(email=*{email})}" method="post" class="w-full md:w-auto">
                        <button type="submit" class="w-full md:w-auto px-6 py-2 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition-colors"
                                th:text="#{client.unblock}">
                            Unblock Client
                        </button>
                    </form>

                    <form th:unless="*{isBlocked}" th:method="put" th:action="@{/clients/{email}/block(email=*{email})}" method="post" class="w-full md:w-auto">
                        <button type="submit" class="w-full md:w-auto px-6 py-2 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition-colors"
                                th:text="#{client.block}">
                            Block Client
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="border-t pt-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-3" th:text="#{client.manageBalance}">Manage Balance</h3>

            <form th:action="@{/clients/{email}/add-balance(email=*{email})}" method="post" class="flex flex-col md:flex-row md:items-end gap-4">
                <input type="hidden" name="clientEmail" th:value="*{email}" />

                <div class="w-full md:w-auto">
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1" th:text="#{client.amountToAdd}">Amount to Add</label>
                    <input type="number" id="amount" name="amount" value="10.00" min="0.01" step="0.01"
                           class="block w-full md:w-40 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2">
                </div>

                <button type="submit" class="w-full md:w-auto px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition-colors"
                        th:text="#{client.addFounds}">
                    Add Funds
                </button>
            </form>
        </div>

    </div>
</main>

</body>
</html>
