<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{client.list}">Client List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900" th:replace="fragments/layout :: layout (~{::main})">

<main class="container mx-auto px-6 py-12">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-gray-800" th:text="#{clients.registered}">Registered Clients</h1>

        <div class="w-full md:w-auto">
            <div th:replace="~{fragments/search :: searchForm(@{/clients}, 'client.search.placeholder')}"></div>
        </div>
    </div>

    <div class="flex flex-wrap gap-2 items-center mb-6">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-wide" th:text="#{sort.label}">Sort by:</span>

        <a th:href="@{/clients(page=${clientPage.number}, size=${clientPage.size}, sort='name,' + (${param.sort != null && param.sort[0] == 'name,asc'} ? 'desc' : 'asc'), keyword=${keyword})}"
           th:classappend="${param.sort != null && param.sort[0].startsWith('name')} ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-white text-gray-600 border-gray-300'"
           class="px-3 py-1 rounded-full text-xs font-medium border shadow-sm transition-colors duration-150 flex items-center gap-1">
            <span th:text="#{user.fullname}">Full Name</span>
            <span th:if="${param.sort != null && param.sort[0] == 'name,asc'}">↑</span>
            <span th:if="${param.sort != null && param.sort[0] == 'name,desc'}">↓</span>
        </a>

        <a th:href="@{/clients(page=${clientPage.number}, size=${clientPage.size}, sort='email,' + (${param.sort != null && param.sort[0] == 'email,asc'} ? 'desc' : 'asc'), keyword=${keyword})}"
           th:classappend="${param.sort != null && param.sort[0].startsWith('email')} ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-white text-gray-600 border-gray-300'"
           class="px-3 py-1 rounded-full text-xs font-medium border shadow-sm transition-colors duration-150 flex items-center gap-1">
            <span th:text="#{user.email}">Email</span>
            <span th:if="${param.sort != null && param.sort[0] == 'email,asc'}">↑</span>
            <span th:if="${param.sort != null && param.sort[0] == 'email,desc'}">↓</span>
        </a>

        <a th:href="@{/clients(page=${clientPage.number}, size=${clientPage.size}, sort='balance,' + (${param.sort != null && param.sort[0] == 'balance,asc'} ? 'desc' : 'asc'), keyword=${keyword})}"
           th:classappend="${param.sort != null && param.sort[0].startsWith('balance')} ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-white text-gray-600 border-gray-300'"
           class="px-3 py-1 rounded-full text-xs font-medium border shadow-sm transition-colors duration-150 flex items-center gap-1">
            <span th:text="#{client.balance}">Balance</span>
            <span th:if="${param.sort != null && param.sort[0] == 'balance,asc'}">↑</span>
            <span th:if="${param.sort != null && param.sort[0] == 'balance,desc'}">↓</span>
        </a>
    </div>

    <div class="space-y-6">

        <div class="md:hidden space-y-4">
            <div th:each="client : ${clientPage.content}" class="bg-white shadow rounded-lg p-4 border border-gray-200">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-lg font-bold text-gray-900" th:text="${client.name}">Client Name</h3>
                    <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"
                          th:text="${client.balance}">
                    Balance
                </span>
                </div>

                <div class="text-sm text-gray-600 mb-3 break-all">
                    <span class="font-medium text-gray-800" th:text="${client.email}">Email</span>
                </div>

                <div class="flex justify-end items-center mt-3 border-t pt-3">
                    <a sec:authorize="hasRole('EMPLOYEE')" th:href="@{/clients/{email}(email=${client.email})}"
                       class="text-blue-600 hover:text-blue-800 font-medium text-sm uppercase tracking-wide">
                        <span th:text="#{actions}">View</span> &rarr;
                    </a>
                </div>
            </div>

            <div th:if="${clientPage.empty}" class="bg-white p-6 rounded-lg shadow text-center text-gray-500">
                <p th:text="#{client.noFound}">No clients found.</p>
            </div>
        </div>

        <div class="hidden md:block bg-white shadow-xl rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
                            <span th:text="#{user.fullname}">Name</span>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
                            <span th:text="#{user.email}">Email</span>
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
                            <span th:text="#{client.balance}">Balance</span>
                        </th>
                        <th scope="col" class="relative px-6 py-3">
                            <span class="sr-only" th:text="#{actions}">Actions</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="client : ${clientPage.content}">

                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900" th:text="${client.name}">
                                Client Name
                            </div>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700" th:text="${client.email}">
                                Client Email
                            </div>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800" th:text="${client.balance}">
                        Client Balance
                    </span>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                            <a sec:authorize="hasRole('EMPLOYEE')" th:href="@{/clients/{email}(email=${client.email})}"
                               class="text-blue-600 hover:text-blue-900"
                               th:text="#{actions}">View</a>
                        </td>
                    </tr>

                    <tr th:if="${clientPage.empty}">
                        <td colspan="4" class="px-6 py-12 text-center text-gray-500" th:text="#{client.noFound}">
                            No clients found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div th:replace="~{fragments/pagination :: paginationControls(page=${clientPage}, url=@{/clients})}"></div>

</main>
</body>
</html>
