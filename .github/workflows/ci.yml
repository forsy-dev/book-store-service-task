name: Java CI with Maven

# 1. When should this robot wake up?
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

# 2. What should the robot do?
jobs:
  build:
    runs-on: ubuntu-latest # Spins up a fresh Linux machine in the cloud

    steps:
      # Step A: Download your code into the Linux machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step B: Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # The standard open-source Java distribution
          cache: maven # MAGICAL PERFORMANCE TRICK: Caches your downloaded JARs so future builds are 5x faster

      # Step C: The Forgemaster's Command
      - name: Build and Test with Maven
        run: mvn clean package
        # If Checkstyle or Tests fail here, the pipeline stops!
        # The Red Cross appears, and deployment is halted.

      # 4. Unlock the Vault (Login to Docker Hub)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Forge the Container and Push to the Vault
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/book-store-service:latest

      # 6. Deploy to the AWS Tower
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the newest container from your Vault
            docker pull ${{ secrets.DOCKER_USERNAME }}/book-store-service:latest
            
            # Stop and remove the old container if it exists (so ports don't clash)
            docker stop bookstore || true
            docker rm bookstore || true
            
            # Start the new container with RDS Database connection!
            docker run -d --name bookstore -p 80:8080 \
            -e SERVER_PORT=8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.DB_HOST }}:3306/bookstore \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }} \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            ***/book-store-service:latest
