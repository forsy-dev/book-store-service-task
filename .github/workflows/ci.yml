name: Java CI with Maven

# 1. When should this robot wake up?
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

# 2. What should the robot do?
jobs:
  build:
    runs-on: ubuntu-latest # Spins up a fresh Linux machine in the cloud

    steps:
      # Step A: Download your code into the Linux machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step B: Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # The standard open-source Java distribution
          cache: maven # MAGICAL PERFORMANCE TRICK: Caches your downloaded JARs so future builds are 5x faster

      # Step C: The Forgemaster's Command
      - name: Build and Test with Maven
        run: mvn clean package
        # If Checkstyle or Tests fail here, the pipeline stops!
        # The Red Cross appears, and deployment is halted.

      # 4. Unlock the Vault (Login to Docker Hub)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Forge the Container and Push to the Vault
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/book-store-service:latest

      # 6. Tell AWS to refresh the clones (No SSH needed!)
      - name: AWS ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name bookstore-asg \
            --region eu-north-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
