name: Java CI with Maven

# 1. When should this robot wake up?
on:
    push:
        branches: [ "main", "master", "develop" ]
    pull_request:
        branches: [ "main", "master", "develop" ]

# 2. What should the robot do?
jobs:
    build:
        runs-on: ubuntu-latest # Spins up a fresh Linux machine in the cloud

        steps:
            # Step A: Download your code into the Linux machine
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step B: Install Java 17
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin' # The standard open-source Java distribution
                  cache: maven # MAGICAL PERFORMANCE TRICK: Caches your downloaded JARs so future builds are 5x faster

            # Step C: The Forgemaster's Command
            - name: Build and Test with Maven
                # We use 'verify' so it runs Checkstyle, Unit Tests, and Integration Tests
              run: mvn clean verify
